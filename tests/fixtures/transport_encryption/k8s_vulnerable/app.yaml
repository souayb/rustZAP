# Intentionally insecure Kubernetes fixture (rendered manifests).
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  DATABASE_URL: "postgres://app:fixturepass@postgres.data.svc.cluster.local:5432/app?sslmode=require"
  MAIL_HOST: smtp.example.com
  MAIL_USE_TLS: "false"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  template:
    spec:
      containers:
        - name: api
          image: example/api:1.0
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: SEARCH_URL
              value: http://search.default.svc:9200
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: redis
                  key: url
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly-backup
spec:
  schedule: "0 2 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: dump
              image: postgres:16
              command: ["/bin/sh", "-c"]
              args: ["pg_dump \"$DATABASE_URL\" > /backup/db.sql && tar czf /backup/uploads.tgz /srv/uploads"]
---
apiVersion: v1
kind: Secret
metadata:
  name: redis
stringData:
  url: rediss://redis:6380
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: encrypted-gp3
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
spec:
  storageClassName: encrypted-gp3
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
