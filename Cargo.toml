[package]
name = "rustzap"
version = "0.1.0"
edition = "2021"
description = "A Rust-based web application security scanner inspired by OWASP ZAP"
authors = ["RustZAP Contributors"]
license = "MIT"
repository = "https://github.com/souayb/rustZAP"
homepage = "https://github.com/souayb/rustZAP"

[[bin]]
name = "rustzap"
path = "src/main.rs"

[lib]
name = "rustzap"
path = "src/lib.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client
reqwest = { version = "0.11", features = ["json", "cookies", "gzip", "deflate", "rustls-tls"], default-features = false }

# Proxy server
hyper = { version = "0.14", features = ["full"] }
hyper-rustls = "0.24"
rustls = "0.21"
tokio-rustls = "0.24"

# HTML parsing / spidering
scraper = "0.18"

# CLI
clap = { version = "4", features = ["derive", "color"] }
colored = "2"
indicatif = "0.17"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# URL handling
url = "2"

# Regex
regex = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async traits
async-trait = "0.1"
futures = "0.3"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Random
rand = "0.8"

# Error handling
anyhow = "1"
thiserror = "1"

# Channel
tokio-channel = "0.1"
ratatui = "0.30.0"
crossterm = "0.29.0"
base64 = "0.22.1"
sha2 = "0.10"
hex = "0.4"

# C1: TLS certificate inspection (parses peer certs returned by rustls)
x509-parser = "0.16"

# F1: Active Directory / NTLM-relay detector (LDAP + DNS; NTLM flags hand-rolled)
ldap3 = { version = "0.11", default-features = false, features = ["tls-rustls"] }
hickory-resolver = "0.24"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# Smaller release binaries, and lets Cargo strip via rustc instead of shelling
# out to the platform `strip` — avoids cargo-deb's cross-platform strip-flag
# mismatch (macOS `strip` rejects GNU's `--strip-unneeded`).
strip = true

[dev-dependencies]
serde_json = "1"

# ─────────────────────────────────────────────────────────────────────────
# Linux packaging metadata (see .claude/skills/cross-platform-installer and
# packaging/README.md). Version, description, license, and authors above are
# the single source of truth — cargo-deb / cargo-generate-rpm read them
# directly and only the fields below need to be package-format-specific.
# ─────────────────────────────────────────────────────────────────────────

[package.metadata.deb]
maintainer = "RustZAP Contributors <noreply@rustzap.dev>"
copyright = "2026, RustZAP Contributors"
license-file = ["LICENSE", "0"]
extended-description = """\
RustZAP is a web application security scanner inspired by OWASP ZAP: spider, \
passive analysis, active plugins, an intercepting proxy, a stress tester, and \
a TUI console — with an optional installer for companion pentest tooling."""
section = "utils"
priority = "optional"
depends = "$auto"
assets = [
    ["target/release/rustzap", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/rustzap/README.md", "644"],
    ["LICENSE", "usr/share/doc/rustzap/LICENSE", "644"],
    ["packaging/linux/appimage/rustzap.desktop", "usr/share/applications/rustzap.desktop", "644"],
]

[package.metadata.generate-rpm]
license = "MIT"
assets = [
    { source = "target/release/rustzap", dest = "/usr/bin/rustzap", mode = "755" },
    { source = "README.md", dest = "/usr/share/doc/rustzap/README.md", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/doc/rustzap/LICENSE", mode = "644", doc = true },
]
