name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Contribution checks
        shell: bash
        run: bash scripts/dev-check.sh ci

  vscode-extension:
    name: vscode-extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - run: npm ci
      - run: npm run compile
      - run: npm test

  isolated-environment:
    name: full Kali environment (Linux amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: rustzap:ci-full
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify full installation and unprivileged runtime
        run: |
          docker run --rm --network=none --cap-drop=ALL --security-opt=no-new-privileges rustzap:ci-full --version
          docker run --rm --network=none --cap-drop=ALL --security-opt=no-new-privileges rustzap:ci-full install --list
          docker run --rm --network=none --cap-drop=ALL --security-opt=no-new-privileges --entrypoint sh rustzap:ci-full -c 'test "$(id -u)" != 0 && semgrep --version && trivy --version && checkov --version'
